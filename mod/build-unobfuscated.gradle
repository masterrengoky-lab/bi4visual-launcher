plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_unobf_version}"
}

version = project.mod_version
group = 'net.bi4visual'

base {
    archivesName = "bi4visual-${project.minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mc': project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
