plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_unobf_version}"
}

version = project.mod_version
group = 'net.bi4visual'

base {
    archivesName = "bi4visual-${project.minecraft_version}"
}

// Parts of the game API that changed between versions live in their own
// source folders; pick the ones for this build.
def mc = project.minecraft_version
def v = mc.tokenize('.').collect { it as int }
while (v.size() < 3) { v << 0 }
def atLeast = { List<Integer> o -> (v[0] <=> o[0] ?: v[1] <=> o[1] ?: v[2] <=> o[2]) >= 0 }
// 26.2: the world is drawn from submitted nodes instead of immediate buffers.
sourceSets.main.java.srcDir(atLeast([26, 2, 0]) ? 'src/submit/java' : 'src/buffers/java')
// Fonts: a ResourceLocation, then a FontDescription (1.21.9), then Identifier (1.21.11).
sourceSets.main.java.srcDir(atLeast([1, 21, 11]) ? 'src/font-desc-id/java'
        : atLeast([1, 21, 9]) ? 'src/font-desc-rl/java' : 'src/font-rl/java')
// 1.21.9: the sky pass stops passing a buffer source we can draw the galaxy into.
sourceSets.main.java.srcDir(atLeast([1, 21, 9]) ? 'src/sky-none/java' : 'src/sky-buffers/java')
sourceSets.main.java.srcDir(atLeast([1, 21, 9]) ? 'src/hand-none/java' : 'src/hand-buffers/java')
sourceSets.main.java.srcDir(atLeast([1, 21, 6]) ? 'src/fog-none/java' : 'src/fog-params/java')
// HUD and main menu draw with GuiGraphics, which 26.x replaced; 1.21.11 moved button drawing to renderContents.
if (atLeast([26, 0, 0])) {
    sourceSets.main.java.srcDir('src/hud-none/java')
} else {
    sourceSets.main.java.srcDir('src/hud-gui/java')
    sourceSets.main.java.srcDir(atLeast([1, 21, 11]) ? 'src/menu-contents/java' : 'src/menu-widget/java')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mc': project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
