plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_unobf_version}"
}

version = project.mod_version
group = 'net.bi4visual'

base {
    archivesName = "bi4visual-${project.minecraft_version}"
}

// How the lyrics reach the screen changed in 26.2: before it, immediate
// vertex buffers; from it on, nodes submitted to the level renderer.
def mc = project.minecraft_version
def submitNodes = !mc.startsWith('1.') && !(mc ==~ /26\.1(\..*)?/)
sourceSets.main.java.srcDir(submitNodes ? 'src/submit/java' : 'src/buffers/java')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mc': project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
