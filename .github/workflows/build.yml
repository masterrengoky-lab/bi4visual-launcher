name: KissLauncherVis

# Every push publishes release kiss-v<version> with the Windows installer and
# the .bat that downloads and installs it.
on:
  push:
    branches: [kisslaunchervis]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kiss-core

  # Every stable game version from 1.21.4 on gets its own build of the mod.
  mod-versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: |
          list=$(curl -fsSL https://meta.fabricmc.net/v2/versions/game | python3 -c "
          import json, re, sys
          def key(v): return tuple(int(x) for x in v.split('.'))
          vs = [g['version'] for g in json.load(sys.stdin) if g['stable'] and re.fullmatch(r'\d+(\.\d+)+', g['version'])]
          print(json.dumps(sorted((v for v in vs if key(v) >= (1, 21, 4)), key=key)))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Версии: $list"

  mod:
    needs: mod-versions
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.mod-versions.outputs.list) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.mc, '1.') && '21' || '25' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ startsWith(matrix.mc, '1.') && '8.14.3' || 'current' }}
      - run: gradle build -Pminecraft_version=${{ matrix.mc }} --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Show build errors
        if: failure()
        run: echo "::error::$(grep -vE "^\s*$|Download|lock" build.log | tail -45 | sed ':a;N;$!ba;s/\n/%0A/g')"
      # Mixins are not checked at compile time: make sure the hooked method
      # exists in this version, otherwise the lyrics would silently not show.
      - name: Check the render hook
        shell: bash
        run: |
          mc=${{ matrix.mc }}
          if [[ $mc == 1.* || $mc =~ ^26\.1(\.|$) ]]; then hook=renderLevel; else hook=submitFeatures; fi
          for j in $(find ~/.gradle .gradle -name "*.jar" -size +5M 2>/dev/null | grep -i minecraft); do
            if unzip -l "$j" | grep -q "net/minecraft/client/renderer/LevelRenderer.class"; then jar=$j; break; fi
          done
          if javap -p -cp "$jar" net.minecraft.client.renderer.LevelRenderer | grep -q " $hook("; then
            echo "LevelRenderer.$hook найден"
          else
            echo "::error::$mc: нет LevelRenderer.$hook"
            exit 1
          fi
      - run: |
          mkdir -p out
          cp $(ls build/libs/*.jar | grep -v -- -sources) out/bi4visual-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.mc }}
          path: mod/out/*.jar

  build:
    needs: [test, mod]
    # A version the mod does not build for yet must not stop the launcher.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mod-*
          merge-multiple: true
          path: src-tauri/resources/mods
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure app id for Microsoft sign-in. Without it only offline accounts work.
          BI4VISUAL_MS_CLIENT_ID: ${{ secrets.BI4VISUAL_MS_CLIENT_ID }}
        with:
          tagName: kiss-v__VERSION__
          releaseName: KissLauncherVis v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: Скачайте KissLauncherVis.bat и запустите его двойным кликом. Он сам скачает установщик, поставит лаунчер и откроет его.
          releaseDraft: false
      - name: Attach the .bat
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "kiss-v${{ steps.tauri.outputs.appVersion }}" scripts/KissLauncherVis.bat --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: KissLauncherVis-windows
          path: |
            target/release/bundle/nsis/*.exe
            scripts/KissLauncherVis.bat
