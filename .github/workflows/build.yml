name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bi4visual-core

  # Every stable game version from 1.21.4 on gets its own build of the mod.
  mod-versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: |
          list=$(curl -fsSL https://meta.fabricmc.net/v2/versions/game | python3 -c "
          import json, re, sys
          def key(v): return tuple(int(x) for x in v.split('.'))
          vs = [g['version'] for g in json.load(sys.stdin) if g['stable'] and re.fullmatch(r'\d+(\.\d+)+', g['version'])]
          print(json.dumps(sorted((v for v in vs if key(v) >= (1, 21, 4)), key=key)))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Версии: $list"

  mod:
    needs: mod-versions
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.mod-versions.outputs.list) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle build -Pminecraft_version=${{ matrix.mc }} --no-daemon
      - run: |
          mkdir -p out
          cp $(ls build/libs/*.jar | grep -v -- -sources) out/bi4visual-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.mc }}
          path: mod/out/*.jar

  build:
    needs: [test, mod]
    # A version the mod does not build for yet must not stop the launcher.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mod-*
          merge-multiple: true
          path: src-tauri/resources/mods
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure app id for Microsoft sign-in. Without it only offline accounts work.
          BI4VISUAL_MS_CLIENT_ID: ${{ secrets.BI4VISUAL_MS_CLIENT_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: bi4visual launcher ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: bi4visual-launcher-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
