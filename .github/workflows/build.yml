name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bi4visual-core

  # Every stable game version from 1.21.4 on gets its own build of the mod.
  mod-versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: |
          list=$(curl -fsSL https://meta.fabricmc.net/v2/versions/game | python3 -c "
          import json, re, sys
          def key(v): return tuple(int(x) for x in v.split('.'))
          vs = [g['version'] for g in json.load(sys.stdin) if g['stable'] and re.fullmatch(r'\d+(\.\d+)+', g['version'])]
          print(json.dumps(sorted((v for v in vs if key(v) >= (1, 21, 4)), key=key)))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Версии: $list"

  mod:
    needs: mod-versions
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.mod-versions.outputs.list) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.mc, '1.') && '21' || '25' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ startsWith(matrix.mc, '1.') && '8.14.3' || 'current' }}
      - run: gradle build -Pminecraft_version=${{ matrix.mc }} --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Show build errors
        if: failure()
        run: echo "::error::$(grep -vE "^\s*$|Download|lock" build.log | tail -45 | sed ':a;N;$!ba;s/\n/%0A/g')"
      # Mixins are not checked at compile time: make sure the hooked method
      # exists in this version, otherwise the lyrics would silently not show.
      - name: Check the render hook
        shell: bash
        run: |
          mc=${{ matrix.mc }}
          if [[ $mc == 1.* || $mc =~ ^26\.1(\.|$) ]]; then hook=renderLevel; else hook=submitFeatures; fi
          for j in $(find ~/.gradle .gradle -name "*.jar" -size +5M 2>/dev/null | grep -i minecraft); do
            if unzip -l "$j" | grep -q "net/minecraft/client/renderer/LevelRenderer.class"; then jar=$j; break; fi
          done
          if javap -p -cp "$jar" net.minecraft.client.renderer.LevelRenderer | grep -q " $hook("; then
            echo "LevelRenderer.$hook найден"
          else
            echo "::error::$mc: нет LevelRenderer.$hook"
            exit 1
          fi
      - run: |
          mkdir -p out
          cp $(ls build/libs/*.jar | grep -v -- -sources) out/bi4visual-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.mc }}
          path: mod/out/*.jar

  build:
    needs: [test, mod]
    # A version the mod does not build for yet must not stop the launcher.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mod-*
          merge-multiple: true
          path: src-tauri/resources/mods
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure app id for Microsoft sign-in. Without it only offline accounts work.
          BI4VISUAL_MS_CLIENT_ID: ${{ secrets.BI4VISUAL_MS_CLIENT_ID }}
          # Signs the update packages. Without it the release still goes out, only auto-update is skipped.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Every push to main publishes the version from package.json as a release.
          tagName: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'v__VERSION__' || '' }}
          releaseName: bi4visual launcher v__VERSION__
          releaseBody: Скачай установщик для своей системы ниже. Уже установленный лаунчер обновится сам.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--config {"bundle":{"createUpdaterArtifacts":false}}' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bi4visual-launcher-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  # The app checks releases/download/updater/latest.json, a fixed release, so other releases can't take over "latest".
  updater-feed:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(jq -r .version package.json)
          gh release download "v$version" -p latest.json -D feed || { echo "no latest.json (signing key not set), skipping"; exit 0; }
          gh release view updater >/dev/null 2>&1 || gh release create updater --title "Автообновление" --notes "Служебный релиз для автообновления лаунчера." --latest=false
          gh release upload updater feed/latest.json --clobber
